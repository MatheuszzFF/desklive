<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board</title>
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["overlay","full-access","notifications","menu-bar","shortcuts"]}</script>
<!--
================================================================================
 BOARD · palco transparente do tamanho da área útil de um monitor (v1)
================================================================================
 A janela cobre a área útil do monitor dela, fica sempre no topo, transparente e
 com o clique passando. Ela NUNCA anda nem muda de tamanho (só quando o monitor
 muda). Os mini apps vivem dentro como PEÇAS. Um Board por monitor = um artefato
 instalado por monitor ("Board", "Board 2"…); eles conversam por ~/.orbita.

 CAMADAS (de baixo pra cima, todas filhas do body, nenhuma dentro de uma peça):
   1 #camada-guias      guias, prévia, marcas ............ pointer-events:none
   2 #camada-fantasmas  peças vindo de outro Board ....... pointer-events:none
   3 #camada-pecas      as peças (z: arrastada > última clicada > resto)
   4 #camada-baloes     balões, avisos ................... pointer-events:none
   5 #camada-debug      overlay de afinação .............. pointer-events:none
 Só as peças pegam o mouse. O clique-passa só desliga com o cursor DENTRO da
 forma real de uma peça (halo de até 8 px só chegando rápido), religa NA HORA
 ao sair e tem vigia (relê o cursor) + religa em blur, erro e cancel.

 API DE PEÇA (registrar mais um mini app = um Board.registrar a mais)
 ---------------------------------------------------------------------------
   Board.registrar({
     id:'onda', nome:'Onda',         // id único entre todos os Boards
     passavel:true,                  // atravessa a emenda pra outro Board
     persistir:true,                 // posição/forma em ~/.orbita/board-estado.json
     inicial:{ forma:'top', ax:.5 }, // onde nasce na primeira vez (opcional)
     criar(ctx) {                    // monta o conteúdo; devolve a instância:
       return {
         el,                                   // conteúdo (vai dentro da forma recortada)
         fundo:'rgba(…)',                      // cor do corpo e dos ombros côncavos
         caixa(area) -> {w,h},                 // maior tamanho possível (layout fixo)
         tamanho(forma, degrau, area) -> {w,h},// tamanho visível por forma e degrau
         raios(forma, degrau) -> [tl,tr,br,bl],// opcional (padrão: 0 no lado fundido)
         formaArrasto:'livre',                 // forma enquanto arrasta
         pega(alvoEl) -> bool,                 // dá pra arrastar a partir daqui?
         mapearPega(fx,fy,P) -> {fx,fy},       // ponto pego na forma de arrasto
         clique(e,P),                          // toque sem arrastar num lugar de pega
         onForma(forma, anterior, P),          // trocou de lado/canto (anime por dentro)
         onDegrau(degrau, anterior, P),        // compacto | espiar | aberto
         onSize(w, h, P),                      // a cada quadro em que o tamanho visível muda
         onHover(dentro, P), onFase(fase, dados, P), onArea(area, P), onMostrar(sim, P),
         estado() -> json, restaurar(json),    // viaja junto quando a peça troca de Board
         menu() -> [{label, click}],           // itens extras no menu do clique direito
       };
     }
   });
   ctx: degrau(nome) · fixar(sim) · ancorar(el, ax, ay) (camada interna presa a um
   ponto da forma) · camada(nome, fn(t,P,soma)) (animação somada, devolve true
   enquanto viva) · animar(fn(t)) (mantém o laço acordado) · aviso(txt) · log ·
   salvar() · on(fase, fn) · board (o shell inteiro, pra peças privilegiadas).

 FORMAS: livre | top | bottom | left | right | c-tl | c-tr | c-bl | c-br
 (emendas valem como borda; degraus usam a forma do lado). DEGRAUS: compacto,
 espiar (hover), aberto (clique, fixo até recolher).

 MOTOR DE MOTION (o laço central)
 ---------------------------------------------------------------------------
   Canais por peça: x y w h s rot o r0 r1 r2 r3 sx sy kx f
   (posição, tamanho, escala, rotação, opacidade, 4 raios, deformação 2×2
   simétrica [[sx,kx],[kx,sy]] e fusão com a borda).
   Física em passo fixo de 240 Hz (subpassos), render interpolado; câmera lenta
   global 0,1–1×. Cada canal tem a SUA mola, escolhida por estado:
   PERFIS[estado][grupo] = nome em MOLAS. Estados: arrastando, soltando,
   encaixando, trocando, assentado. k = 0 é "direto" (segue na hora, subpixel).
   Fases (Board.on / onFase): pegou, arrastando, perto, encaixou, soltou,
   assentou, trocouForma. Velocidade e aceleração da entrada: Board.entrada.
   O laço DORME quando nada se mexe; acorda com entrada ou animação ativa.
   Afinação: Ctrl+Alt+Shift+B (ou menu) → peça "Afinação" (molas ao vivo,
   câmera lenta, overlay de vetores, registro ~/.orbita/board-trace.json).
================================================================================
-->
<style>
  /* janela transparente: color-scheme light de propósito (esquema diferente do iframe = fundo opaco) */
  :root{color-scheme:light;
    --fg:#eef0f5;--mut:#9aa1b2;--ac:#f0a98a;--ac2:#8fd3ff;--ok:#8fe3b0;--bad:#ff8f8f;--line:rgba(255,255,255,.09);
    --vidro:rgba(15,16,22,.9);--painel:rgba(14,15,20,.94);--mola:cubic-bezier(.2,.9,.25,1.12)}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:13px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--fg);
    user-select:none;-webkit-user-select:none;cursor:default}
  body{opacity:0;transition:opacity .45s ease}
  body.pronta{opacity:1}
  input,textarea{user-select:text;-webkit-user-select:text}
  body.fora{opacity:1;background:#0d0e13}
  #fora{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));padding:20px;border-radius:18px;background:#15161d;border:1px solid var(--line);text-align:center;box-sizing:border-box}
  #fora b{font-size:15px}
  body.fora #fora{display:block}
  #fora button{margin-top:6px}

  /* ---------- camadas (ordem explícita, nenhuma dentro de peça) ---------- */
  .camada{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  #camada-guias{z-index:1}#camada-fantasmas{z-index:2}#camada-pecas{z-index:3}#camada-baloes{z-index:4}#camada-debug{z-index:5}
  #camada-fantasmas,#camada-fantasmas *{pointer-events:none!important}
  #camada-baloes *{pointer-events:none!important}

  /* ---------- peça: só transform e opacity no corpo; a forma é um recorte (pinta, não faz layout) ---------- */
  .peca{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;--fundo:var(--vidro);contain:layout style}
  .peca.oculta{visibility:hidden;pointer-events:none}
  .peca.movendo{will-change:transform,opacity}
  .peca>.forma{position:absolute;left:0;top:0;background:var(--fundo);overflow:hidden}
  .peca>.ombro{position:absolute;left:0;top:0;width:16px;height:16px;pointer-events:none;opacity:0}
  .ombro.g-bl{background:radial-gradient(circle at 0 100%,transparent 15.5px,var(--fundo) 16px)}
  .ombro.g-br{background:radial-gradient(circle at 100% 100%,transparent 15.5px,var(--fundo) 16px)}
  .ombro.g-tl{background:radial-gradient(circle at 0 0,transparent 15.5px,var(--fundo) 16px)}
  .ombro.g-tr{background:radial-gradient(circle at 100% 0,transparent 15.5px,var(--fundo) 16px)}
  .camada-int{position:absolute;left:0;top:0}

  /* ---------- guias ---------- */
  #guias{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .45s ease}
  #guias.on{opacity:1;transition:opacity .22s ease}
  #guias .nucleo{stroke:rgba(255,255,255,.55);stroke-width:1.5;stroke-linecap:round;fill:none;transition:stroke-width .25s var(--mola),stroke .25s ease}
  #guias .brilho{stroke:var(--ac);stroke-width:7;stroke-linecap:round;fill:none;opacity:0;filter:url(#desfoque);transition:opacity .25s ease}
  #guias .emenda .nucleo{stroke:var(--ac2);stroke-dasharray:2 7}
  #guias .emenda .brilho{stroke:var(--ac2)}
  #guias .fechada .nucleo{stroke:rgba(143,211,255,.45);stroke-dasharray:none}
  #guias .canto .nucleo{stroke-width:2}
  #guias .degrau .nucleo,#guias .canto-emenda .nucleo{stroke:var(--ac2);stroke-width:2}
  #guias .ativa .nucleo{stroke:#fff;stroke-width:3}
  #guias .ativa .brilho{opacity:.85;animation:respira 1.1s ease-in-out infinite}
  #guias .emenda.ativa .nucleo{animation:corre .6s linear infinite}
  @keyframes respira{0%,100%{opacity:.55}50%{opacity:.95}}
  @keyframes corre{to{stroke-dashoffset:-9}}
  #previa{position:absolute;left:0;top:0;opacity:0;background:rgba(240,169,138,.12);box-shadow:inset 0 0 0 1px rgba(240,169,138,.55);transition:opacity .18s linear,border-radius .3s var(--mola),width .3s var(--mola),height .3s var(--mola)}
  #marca{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--ac2);box-shadow:0 0 0 6px rgba(143,211,255,.15);opacity:0;transition:opacity .3s ease}
  #marca.on{opacity:1}
  #trilho{position:absolute;left:0;top:0;height:0;border-top:1px dashed rgba(143,211,255,.45);opacity:0;transition:opacity .3s ease}
  #trilho.on{opacity:1}

  /* ---------- balões e avisos (camada raiz, sempre por cima) ---------- */
  #dica{position:absolute;left:0;top:0;max-width:260px;padding:5px 9px;border-radius:9px;background:rgba(10,11,15,.96);border:1px solid var(--line);font-size:12px;color:var(--fg);
    opacity:0;transition:opacity .12s ease;white-space:nowrap}
  #dica.on{opacity:1;transition:opacity .16s ease .02s}
  #avisos{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
  .avisinho{padding:7px 12px;border-radius:12px;background:rgba(14,15,20,.95);border:1px solid rgba(240,169,138,.35);font-size:12.5px;animation:avIn .32s var(--mola) both}
  .avisinho.sai{animation:avOut .3s ease forwards}
  @keyframes avIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes avOut{to{opacity:0;transform:translateY(-4px) scale(.98)}}

  /* ---------- controles comuns dentro das peças ---------- */
  button{font:inherit;font-size:12.5px;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:9px;padding:5px 9px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.13)}
  button.pri{background:rgba(240,169,138,.22);border-color:rgba(240,169,138,.45)}
  button.sel{background:rgba(143,211,255,.2);border-color:rgba(143,211,255,.5)}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}

  /* ================= SONDA (a primeira peça) ================= */
  .sd{position:absolute;inset:0}
  .sd .vista{transition:opacity .2s ease}
  .sd .vista.off{opacity:0;pointer-events:none}
  .sd .vista.on{opacity:1;transition:opacity .26s ease .06s}
  /* marca: um sonar. Parado = estático (laço e compositor dormem); testando = pinga e varre */
  .radar{position:relative;display:inline-block;width:18px;height:18px;flex:none}
  .radar b{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px rgba(240,169,138,.6)}
  .radar i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(240,169,138,.55)}
  .radar i.r2{inset:-4px;border-color:rgba(143,211,255,.22)}
  .radar em{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,rgba(143,211,255,.45),transparent 28%);opacity:0;transition:opacity .3s ease}
  .sd.ativa .radar i{animation:ping 1.6s cubic-bezier(.2,.6,.3,1) infinite}
  .sd.ativa .radar i.r2{animation-delay:.5s}
  .sd.ativa .radar em{opacity:1;animation:varre 1.8s linear infinite}
  .sd.pisca .radar b{animation:pisca .6s ease}
  @keyframes ping{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.35);opacity:0}}
  @keyframes varre{to{transform:rotate(360deg)}}
  @keyframes pisca{0%{background:var(--ok);box-shadow:0 0 14px var(--ok)}100%{background:var(--ac)}}
  .radar.g{width:34px;height:34px}.radar.g b{width:9px;height:9px;margin:-4.5px 0 0 -4.5px}
  .sd .st{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .sd .nome{font-weight:600;letter-spacing:.02em}

  /* cápsula (solta / arrastando) */
  .c-livre{width:236px;height:44px;display:flex;align-items:center;gap:9px;padding:0 14px;box-sizing:border-box;cursor:grab}
  .c-livre .st{flex:1;text-align:right}
  /* ilha do topo: status + linha de progresso; espiar revela a 2ª linha */
  .c-top{width:248px;height:66px;cursor:grab}
  .c-top .l1{position:absolute;left:0;top:0;width:100%;height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;box-sizing:border-box}
  .c-top .l1 .st{flex:1;text-align:right}
  .c-top .prog{position:absolute;left:14px;right:14px;top:33px;height:2px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
  .c-top .prog i{position:absolute;inset:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transform-origin:0 50%;transform:scaleX(0);transition:transform .2s linear}
  .c-top .l2{position:absolute;left:0;top:38px;width:100%;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;font-size:11.5px;color:var(--mut)}
  /* horizonte de baixo: o ritmo dos quadros como uma linha viva */
  .c-bottom{width:272px;height:66px;cursor:grab}
  .c-bottom .l1{position:absolute;left:0;bottom:0;width:100%;height:36px;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;box-sizing:border-box}
  .c-bottom canvas{flex:1;height:20px;min-width:0}
  .c-bottom .fps{font-variant-numeric:tabular-nums;font-size:12px;color:var(--fg);width:58px;text-align:right}
  .c-bottom .l2{position:absolute;left:0;bottom:38px;width:100%;height:26px;display:flex;align-items:center;padding:0 14px;box-sizing:border-box;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* coluna da esquerda: os 8 testes como contas; espiar revela os nomes */
  .c-left{width:156px;height:212px;cursor:grab}
  .c-left .radar{position:absolute;left:11px;top:12px}
  .c-left ol{list-style:none;margin:0;padding:0;position:absolute;left:0;top:42px;width:100%}
  .c-left li{display:flex;align-items:center;gap:10px;height:20px;padding-left:16px;font-size:11.5px;color:var(--mut);white-space:nowrap}
  .c-left li i{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);box-sizing:border-box;flex:none;transition:background .3s ease,border-color .3s ease,transform .3s var(--mola)}
  .c-left li span{transition:opacity .22s ease}
  .sd[data-degrau=compacto] .c-left li span{opacity:0;transition:opacity .12s ease}
  .c-left li.feito i{background:var(--ok);border-color:var(--ok)}
  .c-left li.rodando i{background:var(--ac);border-color:var(--ac);transform:scale(1.25)}
  /* coluna da direita: um medidor vertical do clique-passa e do laço */
  .c-right{width:128px;height:212px;cursor:grab}
  .c-right .radar{position:absolute;right:11px;top:12px}
  .c-right .barras{position:absolute;right:12px;top:44px;width:16px;height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
  .c-right .barras i{height:6px;border-radius:2px;background:rgba(255,255,255,.1);transition:background .25s ease}
  .c-right .barras i.on{background:var(--ac2)}
  .c-right .barras i.on.q{background:var(--ac)}
  .c-right .cp{position:absolute;right:9px;bottom:14px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);box-sizing:border-box;transition:border-color .2s ease,background .2s ease}
  .c-right .cp.acordado{border-color:var(--ac);background:rgba(240,169,138,.25)}
  .c-right .info{position:absolute;right:44px;top:44px;width:76px;font-size:11.5px;color:var(--mut);line-height:1.5;text-align:right}
  .c-right .info b{display:block;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  /* cantos: o sonar grande com o anel do teste */
  .c-canto{width:136px;height:136px;cursor:grab}
  .c-canto .anel{position:absolute;width:62px;height:62px}
  .c-canto .anel circle{fill:none;stroke-width:2}
  .c-canto .anel .base{stroke:rgba(255,255,255,.08)}
  .c-canto .anel .fio{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:176;transition:stroke-dashoffset .2s linear}
  .c-canto .radar{position:absolute}
  .c-canto .conta{position:absolute;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
  .c-canto .mais{position:absolute;font-size:11px;color:var(--mut);white-space:nowrap}
  .sd[data-forma=c-tl] .c-canto .anel{left:8px;top:8px}.sd[data-forma=c-tl] .c-canto .conta{left:16px;top:76px}.sd[data-forma=c-tl] .c-canto .mais{left:16px;top:104px}
  .sd[data-forma=c-tr] .c-canto .anel{right:8px;top:8px}.sd[data-forma=c-tr] .c-canto .conta{right:16px;top:76px}.sd[data-forma=c-tr] .c-canto .mais{right:16px;top:104px}
  .sd[data-forma=c-bl] .c-canto .anel{left:8px;bottom:8px}.sd[data-forma=c-bl] .c-canto .conta{left:16px;bottom:76px}.sd[data-forma=c-bl] .c-canto .mais{left:16px;bottom:104px}
  .sd[data-forma=c-br] .c-canto .anel{right:8px;bottom:8px}.sd[data-forma=c-br] .c-canto .conta{right:16px;bottom:76px}.sd[data-forma=c-br] .c-canto .mais{right:16px;bottom:104px}
  .c-canto .anel .radar{left:14px;top:14px}

  /* painel aberto */
  .sd-painel{width:400px;display:flex;flex-direction:column;overflow:hidden}
  .sd-painel header{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;border-bottom:1px solid var(--line);cursor:grab;flex:none}
  .sd-painel header .st{flex:1;text-align:right}
  .sd-painel header button{padding:2px 8px;font-size:12px}
  .sd-resumo{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 12px;font-size:12px;border-bottom:1px solid var(--line);flex:none}
  .sd-resumo dt{color:var(--mut)}.sd-resumo dd{margin:0;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sd-aviso{display:none;margin:8px 12px 0;padding:8px 10px;border-radius:10px;background:rgba(240,169,138,.16);border:1px solid rgba(240,169,138,.35);font-size:12.5px;flex:none}
  .sd-aviso.on{display:block}
  .sd-corpo{flex:1;overflow:auto;padding:4px 12px 8px;min-height:0}
  .sd-corpo::-webkit-scrollbar{width:8px}.sd-corpo::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
  details{border-bottom:1px solid var(--line);padding:6px 0}
  summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(-45deg);transition:transform .2s ease}
  details[open] summary::before{transform:rotate(45deg)}
  .dica-txt{color:var(--mut);font-size:12px;margin:6px 0}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .lista{display:flex;flex-direction:column;gap:4px;margin:6px 0}
  .item{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;font-size:12px}
  .item .ops{display:flex;gap:3px}
  .item .ops button{padding:2px 6px;font-size:11px}
  .item .ops i{font-style:normal;color:var(--mut);font-size:10.5px;align-self:center;margin-left:4px}
  .cont{display:inline-flex;align-items:center;gap:6px}
  code.cmd{display:block;font:11px/1.35 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.3);border-radius:8px;padding:6px 8px;white-space:pre-wrap;word-break:break-all;color:#d7dbe6}
  .sd-mon{font:11.5px/1.4 ui-monospace,Consolas,monospace;color:#d7dbe6;white-space:pre-wrap}
  .sd-painel footer{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);flex:none}
  .sd-log{flex:none;height:112px;margin:0 12px 10px;padding:8px;background:rgba(0,0,0,.28);border-radius:9px;overflow:auto;white-space:pre-wrap;font:11.5px/1.4 ui-monospace,Consolas,monospace;color:#d7dbe6}

  /* ---------- v2: o painel original com tudo vivo (textos, alturas, botões) ---------- */
  .peca>.sombra{position:absolute;left:0;top:0;pointer-events:none;opacity:0;box-shadow:0 18px 44px rgba(0,0,0,.34),0 4px 12px rgba(0,0,0,.2)}
  .tx{display:inline-grid;min-width:0;overflow:hidden;vertical-align:bottom}
  .tx>.tv{grid-area:1/1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv.entra{animation:tvIn .3s cubic-bezier(.2,.8,.2,1) both}
  .tv.sai{animation:tvOut .22s ease forwards}

<script>

/* ============================================================================

const desktop = SIM || await (window.claude?.use?.('desktop') ?? Promise.resolve(null)).catch(() => null);
function telaFora(texto, botoes = []){ document.body.classList.add('fora'); $('fora-msg').textContent = texto; $('fora-btn').replaceChildren(...botoes); }

}
/* zoom da página: com o app do Claude em zoom, 1 unidade do host (DIP) vale ZOOM px desta página. O Board trabalha

  if (k === 'getAllDisplays') return async () => { const ds = await Sh.getAllDisplays(); await medirZoom(ds); if (ZOOM === 1) return ds;
    return ds.map(d => ({ ...d, bounds:zr(d.bounds), workArea:zr(d.workArea), size:d.size && { width:d.size.width / ZOOM, height:d.size.height / ZOOM }, workAreaSize:d.workAreaSize && { width:d.workAreaSize.width / ZOOM, height:d.workAreaSize.height / ZOOM }, scaleFactor:(d.scaleFactor || 1) * ZOOM, zoom:ZOOM })); };

const ouvintesLog = new Set();

const ENT = { n:0, i:0, T:new Float64Array(128), X:new Float64Array(128), Y:new Float64Array(128), x:-9999, y:-9999, t:0, vx:0, vy:0, ax:0, ay:0, cru:false, tV:0, eventos:0 };

/* alvos: o que precisa do mouse sem ser peça (Board.alvo(fn(x, y) → bool)). Ex.: um mascote solto, um app hospedado */
const ALVOS = new Set();

/* ============================================================================

/* vsync medido deste Board: mediana do intervalo do rAF num surto de 40 quadros (ao abrir e ao trocar de monitor) */

/* ============================================================================

   2. relay de named pipes (um PowerShell residente por Board, sem binário: passa no Smart App Control): push, ~1 ms;

   oferta (o dono solta a peça no monitor do outro) → aceite (o outro adota e confirma) → liberação (o dono apaga a

const RELAY_PS = `param([string]$me)
$ErrorActionPreference = 'Stop'
$out = [IO.TextWriter]::Synchronized([Console]::Out)
$pool = [RunspaceFactory]::CreateRunspacePool(1, 10); $pool.Open()
$aceitar = [PowerShell]::Create(); $aceitar.RunspacePool = $pool
[void]$aceitar.AddScript({ param($me, $out, $pool)

while ($true){

function iniciarRelay(){

    const p = desktop.childProcess.spawn('powershell', ['-NoProfile', '-NonInteractive', '-EncodedCommand', psB64(script)]);
    CANAL.relay = p;
    p.stdout.on('data', chunk => { CANAL.relayBuf += chunk; let i; while ((i = CANAL.relayBuf.indexOf('\n')) >= 0){ const l = CANAL.relayBuf.slice(0, i).trim(); CANAL.relayBuf = CANAL.relayBuf.slice(i + 1); if (!l) continue; let m; try { m = JSON.parse(l); } catch { continue; } if (m.tipo === 'relay'){ if (m.estado === 'pronto'){ CANAL.relayPronto = true; log('conexão: relay de named pipes pronto', 'mut'); } if (m.semPar){ CANAL.relayRuim.set(m.semPar, now() + 10000); const s = saida.get(m.semPar); if (s) s.chave = ''; } continue; }   /* sem par no pipe: 10 s pelo arquivo */ chegou(m, 'relay'); } });

const asciiJSON = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
function canalPara(p){

function bombaSaida(peer, s){

async function lerCaixaArquivo(){

/* --- batimento: quem está vivo, em que monitor, com que telas, Hz e canal --- */
async function batimento(){
  for (;;){
    try {
      await FS.mkdir(BUS, { recursive:true });
      const quente = algumArrasto() || [...pecas.values()].some(P => P.passando);
      await FS.writeFile(`${BUS}/board-vivo-${INST}.json`, JSON.stringify({ inst:INST, nome:document.title, disp:minha?.id ?? null, area, t:Date.now(), inicio:INICIO, pecas:idsMeus(), quente, escondido:escondidoPorMonitor,
        telasHash:Telas.hash, hz:Telas.hzMedido, escala:minha?.scaleFactor, dpr:devicePixelRatio, relay:CANAL.relayPronto, versao:B.versao }), 'utf8');
      const ents = await FS.readdir(BUS);
      for (const e of ents){
        const m = e.name.match(/^board-vivo-([a-z0-9]+)\.json$/); if (!m || m[1] === INST) continue;
        try { const p = JSON.parse(await FS.readFile(`${BUS}/${e.name}`, 'utf8')); if (Date.now() - p.t < 3500) peers.set(p.inst, p); else if (peers.has(m[1])) esquecerPar(m[1]); } catch {}
      }
      for (const [k, p] of [...peers]) if (Date.now() - p.t > 3500) esquecerPar(k);
      for (const [k] of [...peers]) if (!ents.some(e => e.name === `board-vivo-${k}.json`)) esquecerPar(k);
      const rival = [...peers.values()].find(p => p.disp === minha?.id && !p.escondido && (p.inicio < INICIO || (p.inicio === INICIO && p.inst < INST)));
      if (rival && !escondidoPorMonitor && !sonda?.ocupada()){
        const livre = telas.find(d => d.id !== minha.id && !peerNoDisp(d.id));
        if (livre){ log(`o Board ${rival.inst} já está no monitor ${minha.id}: vou pro ${livre.id}`, 'mut'); await posicionar(livre, 'monitor ocupado'); }
      }
      // duplicata: fica a época maior; empate, o Board mais antigo
      for (const p of peers.values()) for (const it of p.pecas || []){
        const [id, ep] = Array.isArray(it) ? it : [it, 0]; const P = pecas.get(id); if (!P || P.passando) continue;
        const pend = [...aceitas.values()].some(a => a.id === id && !a.liberada); if (pend) continue;
        const minhaEp = P.epoca || 0, ganhaEle = ep > minhaEp || (ep === minhaEp && (p.inicio < INICIO || (p.inicio === INICIO && p.inst < INST)));
        if (ganhaEle){ log(`a peça ${id} já é do Board ${p.inst} (época ${ep}): solto a minha (${minhaEp})`, 'mut'); removerPeca(P); }
      }
      if ([...peers.values()].some(p => p.telasHash && Telas.hash && p.telasHash !== Telas.hash)) { PASSE.divergiuTelas++; Telas.divergiu('no batimento'); }
      batidas++;
      if (batidas >= 2) reivindicar();
    } catch (e) { if (!batimento.avisou){ batimento.avisou = true; log('barramento indisponível (precisa de "full-access"): ' + msg(e), 'bad'); } if (batidas++ >= 1) reivindicar(); }
    await sleep(1000);
  }
}
/* um par sumiu (fechou ou travou): os fantasmas dele somem, o que eu adotei dele é meu, e as peças dele podem ser reivindicadas */
function esquecerPar(k){
  peers.delete(k); CANAL.bcVistos.delete(k);
  for (const [, a] of aceitas) if (a.de === k) a.liberada = true;
  for (const [id, F] of [...fantasmas]) if (F.msgDe === k){ removerFantasma(F); reivindicadas.delete(id); }
  for (const [id, t] of [...cedidas]) if (!pecas.has(id)){ cedidas.delete(id); reivindicadas.delete(id); }   // quem recebeu morreu: posso reivindicar do estado salvo
  for (const P of pecas.values()) if (P.passe?.para === k && P.passe.estado === 'oferta') P.passandoDesde = -1e9;   // a oferta pra ele cancela já

/* --- poses no tempo comum: posição física do canto de cima à esquerda pro instante em que o quadro vai aparecer --- */

let tQuadroRel = 0;
const POSES = { on:false, l:[] };   // só no simulador: onde este Board desenhou a Sonda (físico) em cada instante de tela

        mx:[+C.a.toFixed(5), +C.b.toFixed(5), +C.c.toFixed(5), +C.d.toFixed(5)], piv:[r2(C.px || 0), r2(C.py || 0)], ch:[r3(P.rv[CS]), r3(P.rv[CROT]), r3(P.rv[CSX]), r3(P.rv[CSY]), r3(P.rv[CKX])], o:r3(P.rv[CO]), cl:r3(P.rv[CL]), f:r3(P.rv[CF]), r:[r1(P.rv[CR0]), r1(P.rv[CR1]), r1(P.rv[CR2]), r1(P.rv[CR3])],

    R.testes.passe = { latencia:summ(B.PASSE.lat), adotados:B.PASSE.adotados, semResposta:B.PASSE.semResposta, enviados:B.PASSE.enviados }; R.testes.laco = B.statsLaco(); R.testes.precisao = B.statsPrecisao(); R.meta.board = B.posInfo; R.meta.monitores = B.telas;
    R.meta.ua = { electron:(navigator.userAgent.match(/Electron\/([\d.]+)/) || [])[1] || '?', chrome:(navigator.userAgent.match(/Chrome\/([\d.]+)/) || [])[1] || '?', dpr:devicePixelRatio, rawupdate:'onpointerrawupdate' in window };
    return JSON.stringify(R, null, 2); };
  el.addEventListener('click', async e => {
    const st = e.target.closest('[data-sec]'); if (st && st.classList.contains('sec-tit')) return abrirSecao(st.dataset.sec);
    const t = e.target.closest('button')?.dataset.t; if (!t) return;
    if (t === 'recolher') return ctx.fixar(false);
    if (t === 'afinacao') return executarComando('alternarPeca', 'afinacao', true);
    if (t === 'perdeu+' || t === 'perdeu-'){ perdidos = Math.max(0, perdidos + (t === 'perdeu+' ? 1 : -1)); trocarTexto(q('[data-perdidos]'), perdidos); return; }
    if (t === 'copiar') return navigator.clipboard.writeText(json()).then(() => slog('resultado copiado.', 'ok'), err => slog('não copiou: ' + msg(err), 'bad'));
    if (t === 'salvar'){ try { await B.FS.mkdir(BUS, { recursive:true }); await B.FS.writeFile(`${BUS}/sonda-board.json`, json(), 'utf8'); slog('salvo em ~/.orbita/sonda-board.json', 'ok'); } catch (err) { slog('não salvou (precisa de "full-access"): ' + msg(err), 'bad'); } return; }
    if (t === 'copiarCmd') return navigator.clipboard.writeText(LINHA_GPU).then(() => slog('linha do PowerShell copiada.', 'ok'), () => {});
    if (t === 'animar') return ligarAnimacao(!animar);
    if (t === 'relogio'){ tRelogio = now(); quadrosRelogio = 0; R.testes.relogioZerado = new Date().toISOString(); slog('relógio zerado: compare com o vídeo daqui a 60 s', 'ok'); ctx.animar(() => { quadrosRelogio++; return !!tRelogio && now() - tRelogio < 90000; }); return; }
    if (t === 'memoria') return tMemoria();
    if (t === 'we') return tWe();
    if (t === 'reler'){ await B.relerMonitores('manual'); marcarFeito(7); return; }
    if (t === 'proximo'){ const ord = [...B.telas].sort((a, b) => a.bounds.x - b.bounds.x || a.bounds.y - b.bounds.y), i = ord.findIndex(d => d.id === B.minha.id);
      for (let k = 1; k <= ord.length; k++){ const d = ord[(i + k) % ord.length]; if (d.id !== B.minha.id && !B.peerNoDisp(d.id)) return B.posicionar(d, 'botão'); } return slog('nenhum outro monitor livre', 'mut'); }
    if (t.startsWith('folga-')) return mudarFolga(t.slice(6));
    if (busy) return slog('espere o teste atual terminar', 'mut');
    const T = { cadencia:() => tCadencia(), cliques:() => tCliques(false), cliques0:() => tCliques(true), hoverParado:tHoverParado, fParado:() => tFluidez('parado', 3000, 'parado'), fArrasto:() => tFluidez('arrasto', 15000, 'arrasto'),
      fAnim:() => tFluidez('três animando', 10000, 'anim'), fArrastoAnim:() => tFluidez('arrasto + três animando', 15000, 'arrastoAnim'), quns:tQuns, notif:tNotif, segurar:tSegurar, gpu:tGpu, foco:tFoco };
    T[t]?.();
  });
  setSt('pronta');
  const api = { get teste(){ return teste; }, ocupada:() => busy, contarEncaixe:tipo => { (R.testes.encaixes ||= {})[tipo] = (R.testes.encaixes[tipo] || 0) + 1; }, R, ligarAnimacao, pecaTeste, colocar, tirar, json, abrirSecao, animando, avisoT, slog, pular, tp };
  inst.ativar = () => { vivo = true; B.ouvintesLog.add(slog); sonda = api; B.sonda = api; setTimeout(montarPecasDeTeste, 0); sincronizarAnims(); };   // virou peça de verdade neste Board
  inst.destruir = () => { vivo = false; B.ouvintesLog.delete(slog); clearInterval(animIv); animIv = null; if (animar) ligarAnimacao(false); for (const n of ['cartao', 'pilula', 'onda', 'blob']) tirar(n); if (sonda === api){ sonda = null; B.sonda = null; } };
  return inst;
}

/* ============================================================================
   16. PEÇA: Afinação (painel de dev: molas ao vivo, câmera lenta, overlay, registro)
   ============================================================================ */
B.registrar({ id:'afinacao', nome:'Afinação', passavel:false, persistir:true, noMenu:true, oculta:true, inicial:{ forma:'livre', rx:.72, ry:.3 }, criar:ctx => criarAfinacao(ctx) });
function criarAfinacao(ctx){
  const el = document.createElement('div'); el.className = 'af';
  const lin = (rot, id, min, max, passo, val) => `<div class="lin"><span data-dica="${rot}">${rot}</span><input type="range" data-k="${id}" min="${min}" max="${max}" step="${passo}" value="${val}"><output data-o="${id}">${val}</output></div>`;
  let html = `<header><span class="radar" style="transform:scale(.8)"><i class="r1"></i><b></b></span><b>Afinação do motion</b><button data-a="fechar" data-dica="Esconder">–</button></header>
  <div class="est" data-est>—</div>
  <div class="btns"><button data-a="debug">Overlay: não</button><button data-a="trace">Gravar registro</button><button data-a="padrao">Padrão</button></div>
  <div class="af-rolagem"><h4>Telas e conexão</h4><div class="est af-telas" data-telas>—</div><h4>Tempo e efeitos</h4>${lin('câmera lenta', 'ef:camLenta', .1, 1, .05, EF.camLenta)}${lin('prever (quadros)', 'ef:prever', 0, 1.5, .05, EF.prever)}${lin('levantar', 'ef:levantar', 1, 1.06, .002, EF.levantar)}${lin('inclinar', 'ef:inclinar', 0, .002, .0001, EF.inclinar)}${lin('esticar máx', 'ef:esticarMax', 0, .12, .005, EF.esticarMax)}${lin('inclinar acel.', 'ef:inclinarAcel', 0, .0001, .000005, EF.inclinarAcel)}${lin('amassar', 'ef:amassar', 0, 1, .02, EF.amassar)}${lin('escorrer', 'ef:escorrer', 0, 1.5, .05, EF.escorrer)}<h4>Molas (k · ζ)</h4>`;
  for (const [n, m] of Object.entries(MOLAS)){ if (n === 'direto') continue; html += lin(n + ' k', 'k:' + n, 20, 2400, 10, m.k) + lin(n + ' ζ', 'z:' + n, .1, 1.6, .01, m.z); }
  html += `<h4>Arrasto</h4><div class="lin"><span>posição</span><select data-perfil style="font:inherit;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px"><option value="direto">direto (subpixel)</option><option value="cola">cola (mola)</option></select><output></output></div></div>`;
  el.innerHTML = html;
  const q = s => el.querySelector(s);
  el.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return; const [tipo, nome] = k.split(':'), v = parseFloat(e.target.value);
    if (tipo === 'ef') EF[nome] = v; else if (tipo === 'k') MOLAS[nome].k = v; else MOLAS[nome].z = v;
    el.querySelector(`[data-o="${k}"]`).textContent = v; reaplicarPerfis(); salvarEstadoLogo();
  });
  el.addEventListener('change', e => { if (e.target.matches('[data-perfil]')){ PERFIS.arrastando.pos = e.target.value; reaplicarPerfis(); } });
  el.addEventListener('click', async e => {
    const a = e.target.closest('button')?.dataset.a; if (!a) return;
    if (a === 'fechar') mostrarPeca(ctx.P, false);
    if (a === 'debug'){ B.debug = !B.debug; e.target.textContent = 'Overlay: ' + (B.debug ? 'sim' : 'não'); e.target.classList.toggle('sel', B.debug); }
    if (a === 'trace'){ if (B.trace){ await pararTrace(); e.target.textContent = 'Gravar registro'; } else { iniciarTrace(); e.target.textContent = 'Parar e salvar'; } }
    if (a === 'padrao'){ for (const [n, m] of Object.entries(MOLAS_PADRAO)) MOLAS[n] = { ...m }; Object.assign(EF, EF_PADRAO); reaplicarPerfis(); for (const i of el.querySelectorAll('input[data-k]')){ const [tp, n] = i.dataset.k.split(':'); i.value = tp === 'ef' ? EF[n] : tp === 'k' ? MOLAS[n].k : MOLAS[n].z; el.querySelector(`[data-o="${i.dataset.k}"]`).textContent = i.value; } salvarEstadoLogo(); }
  });
  let iv = null;
  const tick = () => { q('[data-telas]').textContent = diagTelas(); const s = statsLaco(); q('[data-est]').textContent = `laço ${rodando ? 'acordado' : 'dormindo'} · ${quadros} quadros\nJS p50 ${s.p50 ?? '–'} p95 ${s.p95 ?? '–'} máx ${s.max ?? '–'} ms\nentrada ${ENT.cru ? 'pointerrawupdate' : 'pointermove + coalesced'}`; };
  const H = 520;
  return {
    el, fundo:'rgba(13,14,19,.95)', caixa:() => ({ w:300, h:H }), tamanho:() => ({ w:300, h:H }),
    raios:(f) => raiosPadrao(f, 16, 26), pega:t => !!t.closest('header'),
    onMostrar:sim => { clearInterval(iv); iv = sim ? setInterval(tick, 400) : null; if (sim) tick(); },
  };
}

/* ============================================================================
   17. início
   ============================================================================ */
await relerMonitores('início');
const b0 = await W.getBounds().catch(() => ({ x:0, y:0, width:1200, height:800 }));
await posicionar(telaAtual(b0), 'início');
await carregarEstado();
reaplicarPerfis();
CP.quer = true; bomba();
montarBandeja(); montarAtalhos();
document.body.classList.add('pronta');
batimento(); lerCaixaArquivo(); iniciarRelay(); medirHz(); Telas.lerWindows("abrir");
log(`Pronto (Board ${INST}). ${telas.length} monitor(es), dpr ${devicePixelRatio}, entrada ${'onpointerrawupdate' in window ? 'rawupdate' : 'pointermove'}.`, 'mut');
if (SIM) window.__board = { B, pecas, ENT, CP, area:() => area, statsLaco, quadro:() => quadros, rodando:() => rodando, peers, fantasmas, geo:() => geo, minha:() => minha, erros, POSES, Telas, PASSE, CANAL, aceitas, telasM:() => telasM, limites, alvoPara, EF, MOLAS };
})();
